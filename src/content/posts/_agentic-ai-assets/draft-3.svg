<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 460" font-family="ui-monospace, 'SFMono-Regular', 'Google Sans Code', monospace" role="img" aria-labelledby="title desc">
  <title id="title">Draft 3: the overbuilt architecture</title>
  <desc id="desc">A supervisor agent coordinates four specialist agents (evidence researcher, database analyst, statistician, imaging expert), fed by an agents catalog, personas, and access roles, with an evaluator framework and metrics dashboard attached. The diagram is deliberately crowded to show how much machinery was added for a simple classification task.</desc>

  <style>
    :root { color-scheme: light dark; }
    .bg       { fill: #fffaf6; }
    .box      { fill: none; stroke: #54515b; }
    .box-dim  { fill: none; stroke: #54515b; opacity: 0.55; }
    .flow     { stroke: #54515b; opacity: 0.55; fill: none; }
    .label    { fill: #060503; }
    .muted    { fill: #54515b; }
    .hub      { fill: #aa0215; }
    .hub-text { fill: #ffcf75; }
    .dashed   { fill: none; stroke: #54515b; stroke-dasharray: 4 3; opacity: 0.7; }
    @media (prefers-color-scheme: dark) {
      .bg       { fill: #2f2f2f; }
      .box      { stroke: #ddbfa7; }
      .box-dim  { stroke: #ddbfa7; opacity: 0.5; }
      .flow     { stroke: #ddbfa7; opacity: 0.5; }
      .label    { fill: #ebe5e1; }
      .muted    { fill: #ddbfa7; }
      .hub      { fill: #ee781e; }
      .hub-text { fill: #1a1a1a; }
      .dashed   { stroke: #ddbfa7; }
    }
  </style>

  <rect class="bg" x="0" y="0" width="720" height="460" rx="10"/>

  <!-- inputs -> supervisor -->
  <g class="flow" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arrow)">
    <line x1="180" y1="80"  x2="300" y2="190"/>
    <line x1="180" y1="150" x2="300" y2="205"/>
    <line x1="180" y1="220" x2="300" y2="218"/>
  </g>
  <!-- supervisor -> specialists -->
  <g class="flow" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arrow)">
    <line x1="440" y1="205" x2="540" y2="80"/>
    <line x1="440" y1="212" x2="540" y2="160"/>
    <line x1="440" y1="219" x2="540" y2="240"/>
    <line x1="440" y1="226" x2="540" y2="320"/>
  </g>
  <!-- supervisor -> evaluator -->
  <g class="flow" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arrow)">
    <line x1="370" y1="250" x2="370" y2="360"/>
  </g>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#54515b"/>
    </marker>
  </defs>

  <!-- left inputs -->
  <g font-size="12.5" text-anchor="middle">
    <rect class="box-dim" x="40" y="60"  width="140" height="40" rx="7" stroke-width="1.5"/>
    <text class="muted" x="110" y="85">agents catalog</text>
    <rect class="box-dim" x="40" y="130" width="140" height="40" rx="7" stroke-width="1.5"/>
    <text class="muted" x="110" y="155">personas</text>
    <rect class="box-dim" x="40" y="200" width="140" height="40" rx="7" stroke-width="1.5"/>
    <text class="muted" x="110" y="225">access roles</text>
  </g>

  <!-- supervisor hub -->
  <g text-anchor="middle">
    <rect class="hub" x="300" y="185" width="140" height="52" rx="9"/>
    <text class="hub-text" x="370" y="216" font-size="14" font-weight="700">supervisor</text>
  </g>

  <!-- specialist agents -->
  <g font-size="12.5" text-anchor="middle">
    <rect class="box" x="540" y="60"  width="150" height="40" rx="7" stroke-width="1.5"/>
    <text class="label" x="615" y="85">evidence researcher</text>
    <rect class="box" x="540" y="140" width="150" height="40" rx="7" stroke-width="1.5"/>
    <text class="label" x="615" y="165">database analyst</text>
    <rect class="box" x="540" y="220" width="150" height="40" rx="7" stroke-width="1.5"/>
    <text class="label" x="615" y="245">statistician</text>
    <rect class="box" x="540" y="300" width="150" height="40" rx="7" stroke-width="1.5"/>
    <text class="label" x="615" y="325">imaging expert</text>
  </g>

  <!-- evaluator + dashboard -->
  <g font-size="12.5" text-anchor="middle">
    <rect class="dashed" x="290" y="360" width="160" height="56" rx="9" stroke-width="1.5"/>
    <text class="label" x="370" y="384">evaluator framework</text>
    <text class="muted" x="370" y="402">+ metrics dashboard</text>
  </g>

  <!-- caption -->
  <text class="muted" x="360" y="444" font-size="12.5" text-anchor="middle">every box feels like progress. none of it sorts a ticket any better.</text>
</svg>
