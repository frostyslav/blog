<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 180" font-family="ui-monospace, 'SFMono-Regular', 'Google Sans Code', monospace" role="img" aria-labelledby="title desc">
  <title id="title">The shipped architecture</title>
  <desc id="desc">A single left-to-right pipeline: User to API Gateway to Knowledge Base to Parser Lambda. There is no agent anywhere in it.</desc>

  <style>
    :root { color-scheme: light dark; }
    .bg       { fill: #fffaf6; }
    .box      { fill: none; stroke: #54515b; }
    .flow     { stroke: #54515b; fill: none; }
    .label    { fill: #060503; }
    .muted    { fill: #54515b; }
    .hub      { fill: #aa0215; }
    .hub-text { fill: #ffcf75; }
    @media (prefers-color-scheme: dark) {
      .bg       { fill: #2f2f2f; }
      .box      { stroke: #ddbfa7; }
      .flow     { stroke: #ddbfa7; }
      .label    { fill: #ebe5e1; }
      .muted    { fill: #ddbfa7; }
      .hub      { fill: #ee781e; }
      .hub-text { fill: #1a1a1a; }
    }
  </style>

  <rect class="bg" x="0" y="0" width="720" height="180" rx="10"/>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#54515b"/>
    </marker>
  </defs>

  <!-- flow arrows -->
  <g class="flow" stroke-width="1.8" stroke-linecap="round" marker-end="url(#arrow)">
    <line x1="150" y1="80" x2="196" y2="80"/>
    <line x1="342" y1="80" x2="388" y2="80"/>
    <line x1="534" y1="80" x2="580" y2="80"/>
  </g>

  <!-- boxes -->
  <g font-size="13" text-anchor="middle">
    <rect class="box" x="40"  y="58" width="110" height="44" rx="8" stroke-width="1.8"/>
    <text class="label" x="95" y="84">User</text>

    <rect class="box" x="196" y="58" width="146" height="44" rx="8" stroke-width="1.8"/>
    <text class="label" x="269" y="84">API Gateway</text>

    <rect class="hub" x="388" y="58" width="146" height="44" rx="8"/>
    <text class="hub-text" x="461" y="84" font-weight="700">Knowledge Base</text>

    <rect class="box" x="580" y="58" width="120" height="44" rx="8" stroke-width="1.8"/>
    <text class="label" x="640" y="84">Parser Lambda</text>
  </g>

  <!-- caption -->
  <text class="muted" x="360" y="150" font-size="12.5" text-anchor="middle">retrieve, parse, done. no agent in sight.</text>
</svg>
