<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="The kernel packet path versus the DPDK userspace packet path, side by side">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#6b7280"/>
    </marker>
    <marker id="arrowGood" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#10b981"/>
    </marker>
    <style>
      .panel { fill: none; stroke: #cbd5e1; stroke-width: 1.5; stroke-dasharray: 5 4; }
      .nic { fill: #f3f4f6; stroke: #9ca3af; stroke-width: 1.5; }
      .kernel { fill: #fef2f2; stroke: #ef4444; stroke-width: 1.5; }
      .user { fill: #eef2ff; stroke: #6366f1; stroke-width: 1.5; }
      .fast { fill: #ecfdf5; stroke: #10b981; stroke-width: 1.5; }
      .lbl { fill: #111827; font-size: 13px; }
      .lbl-sm { fill: #374151; font-size: 12px; }
      .title { fill: #111827; font-size: 16px; font-weight: 700; }
      .paneltitle { fill: #111827; font-size: 15px; font-weight: 700; }
      .rate { font-size: 15px; font-weight: 700; }
      .rateBad { fill: #dc2626; }
      .rateGood { fill: #059669; }
      .flow { stroke: #6b7280; stroke-width: 1.6; fill: none; }
      .flowGood { stroke: #10b981; stroke-width: 1.8; fill: none; }
      .note { fill: #6b7280; font-size: 11px; }
      @media (prefers-color-scheme: dark) {
        .panel { stroke: #3f4657; }
        .nic { fill: #262b38; stroke: #4b5563; }
        .kernel { fill: #2a1c1c; stroke: #f87171; }
        .user { fill: #23263a; stroke: #818cf8; }
        .fast { fill: #16281f; stroke: #34d399; }
        .lbl { fill: #e5e7eb; }
        .lbl-sm { fill: #cbd5e1; }
        .title { fill: #f3f4f6; }
        .paneltitle { fill: #f3f4f6; }
        .rateBad { fill: #f87171; }
        .rateGood { fill: #34d399; }
        .flow { stroke: #94a3b8; }
        .note { fill: #94a3b8; }
      }
    </style>
  </defs>

  <text x="450" y="28" text-anchor="middle" class="title">Same NICs, two data paths</text>

  <!-- LEFT: kernel path -->
  <rect x="20" y="48" width="420" height="392" rx="10" class="panel"/>
  <text x="230" y="74" text-anchor="middle" class="paneltitle">Kernel path</text>

  <rect x="120" y="92" width="220" height="40" rx="8" class="user"/>
  <text x="230" y="117" text-anchor="middle" class="lbl-sm">Open vSwitch (userspace)</text>

  <rect x="120" y="176" width="220" height="60" rx="8" class="kernel"/>
  <text x="230" y="200" text-anchor="middle" class="lbl-sm">Kernel network stack</text>
  <text x="230" y="220" text-anchor="middle" class="lbl-sm">interrupts, copies, context switches</text>

  <rect x="120" y="280" width="220" height="40" rx="8" class="nic"/>
  <text x="230" y="305" text-anchor="middle" class="lbl-sm">NIC (owned by kernel)</text>

  <!-- flows with copies both ways -->
  <path class="flow" d="M200 176 L200 132" marker-end="url(#arrow)"/>
  <path class="flow" d="M260 132 L260 176" marker-end="url(#arrow)"/>
  <path class="flow" d="M200 280 L200 236" marker-end="url(#arrow)"/>
  <path class="flow" d="M260 236 L260 280" marker-end="url(#arrow)"/>
  <text x="230" y="256" text-anchor="middle" class="note">copy across kernel/user boundary</text>

  <text x="230" y="360" text-anchor="middle" class="rate rateBad">~12 Gbps ceiling</text>
  <text x="230" y="388" text-anchor="middle" class="lbl-sm">per-packet overhead dominates</text>
  <text x="230" y="406" text-anchor="middle" class="lbl-sm">at high packet rates</text>

  <!-- RIGHT: DPDK path -->
  <rect x="460" y="48" width="420" height="392" rx="10" class="panel"/>
  <text x="670" y="74" text-anchor="middle" class="paneltitle">DPDK path (userspace)</text>

  <rect x="540" y="92" width="260" height="64" rx="8" class="fast"/>
  <text x="670" y="114" text-anchor="middle" class="lbl-sm">OVS pod: netdev datapath</text>
  <text x="670" y="134" text-anchor="middle" class="lbl-sm">poll-mode driver, dedicated core</text>
  <text x="670" y="150" text-anchor="middle" class="lbl-sm">busy loop, no interrupts</text>

  <rect x="540" y="196" width="260" height="44" rx="8" class="fast"/>
  <text x="670" y="223" text-anchor="middle" class="lbl-sm">hugepage packet buffers (2 MB pages)</text>

  <rect x="540" y="280" width="260" height="44" rx="8" class="nic"/>
  <text x="670" y="301" text-anchor="middle" class="lbl-sm">NIC bound to vfio-pci</text>
  <text x="670" y="317" text-anchor="middle" class="note">kernel no longer sees it as a netdev</text>

  <path class="flowGood" d="M670 280 L670 240" marker-end="url(#arrowGood)"/>
  <path class="flowGood" d="M670 196 L670 156" marker-end="url(#arrowGood)"/>
  <text x="670" y="262" text-anchor="middle" class="note">no kernel crossing</text>

  <text x="670" y="360" text-anchor="middle" class="rate rateGood">~60 Gbps</text>
  <text x="670" y="388" text-anchor="middle" class="lbl-sm">5x on the same hardware,</text>
  <text x="670" y="406" text-anchor="middle" class="lbl-sm">no new NICs</text>
</svg>
