<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" font-family="ui-monospace, 'SFMono-Regular', 'Google Sans Code', monospace" role="img" aria-labelledby="title desc">
  <title id="title">The shift-left cost curve</title>
  <desc id="desc">A bug gets more expensive to fix the later it is caught: seconds on the developer's machine, minutes in a pull request, an afternoon in staging, and hours plus a hotfix in production.</desc>

  <style>
    :root { color-scheme: light dark; }
    .bg      { fill: #fffaf6; }
    .axis    { stroke: #54515b; }
    .grid    { stroke: #ffdc98; }
    .label   { fill: #060503; }
    .muted   { fill: #54515b; }
    .curve   { stroke: #aa0215; }
    .dot     { stroke: #aa0215; }
    .dot-in  { fill: #fffaf6; }
    @media (prefers-color-scheme: dark) {
      .bg     { fill: #2f2f2f; }
      .axis   { stroke: #ddbfa7; }
      .grid   { stroke: #6f5648; }
      .label  { fill: #ebe5e1; }
      .muted  { fill: #ddbfa7; }
      .curve  { stroke: #ee781e; }
      .dot    { stroke: #ee781e; }
      .dot-in { fill: #2f2f2f; }
    }
  </style>

  <rect class="bg" x="0" y="0" width="720" height="440" rx="10"/>

  <!-- grid lines -->
  <g class="grid" stroke-width="1" stroke-dasharray="4 5" opacity="0.6">
    <line x1="70" y1="80"  x2="680" y2="80"/>
    <line x1="70" y1="160" x2="680" y2="160"/>
    <line x1="70" y1="240" x2="680" y2="240"/>
    <line x1="70" y1="320" x2="680" y2="320"/>
  </g>

  <!-- axes -->
  <g class="axis" stroke-width="2" fill="none" stroke-linecap="round">
    <line x1="70" y1="40" x2="70" y2="360"/>
    <line x1="70" y1="360" x2="690" y2="360"/>
  </g>

  <!-- axis labels -->
  <text class="muted" x="70" y="26" font-size="13" text-anchor="start">cost to fix</text>

  <!-- rising curve through the four points -->
  <path class="curve" fill="none" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"
        d="M 140 335 C 240 330, 250 300, 320 285 C 380 272, 400 215, 470 195 C 520 181, 540 110, 600 70"/>

  <!-- data points: solid bg disc masks the curve, then accent ring on top -->
  <g>
    <circle class="dot-in" cx="140" cy="335" r="7.5"/><circle class="dot" cx="140" cy="335" r="7.5" fill="none" stroke-width="3.5"/>
    <circle class="dot-in" cx="320" cy="285" r="7.5"/><circle class="dot" cx="320" cy="285" r="7.5" fill="none" stroke-width="3.5"/>
    <circle class="dot-in" cx="470" cy="195" r="7.5"/><circle class="dot" cx="470" cy="195" r="7.5" fill="none" stroke-width="3.5"/>
    <circle class="dot-in" cx="600" cy="70"  r="7.5"/><circle class="dot" cx="600" cy="70"  r="7.5" fill="none" stroke-width="3.5"/>
  </g>

  <!-- stage labels along the x-axis -->
  <g font-size="13" text-anchor="middle">
    <text class="label" font-weight="700" x="140" y="384">your machine</text>
    <text class="label" font-weight="700" x="320" y="384">pull request</text>
    <text class="label" font-weight="700" x="470" y="384">staging</text>
    <text class="label" font-weight="700" x="600" y="384">production</text>
  </g>

  <!-- x-axis caption on its own row -->
  <text class="muted" x="380" y="416" font-size="13" text-anchor="middle">how late it's caught &#8594;</text>

  <!-- cost callouts near each point -->
  <g font-size="12.5" text-anchor="middle">
    <text class="muted" x="140" y="322">seconds</text>
    <text class="muted" x="320" y="272">minutes</text>
    <text class="muted" x="452" y="168">an afternoon</text>
    <text class="muted" x="600" y="57">hours + a hotfix</text>
  </g>
</svg>
