<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Additional services layered on top of the VPN: squid routing traffic through compression, ad-blocking and antivirus, redrawn from memory">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#6b7280"/>
    </marker>
    <style>
      .box { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.5; }
      .edge { fill: #f3f4f6; stroke: #9ca3af; }
      .svc { fill: #fde8cf; stroke: #d98a2b; }
      .cloud { fill: #eef2ff; stroke: #818cf8; }
      .lbl { fill: #111827; font-size: 14px; }
      .lbl-sm { fill: #374151; font-size: 12px; }
      .title { fill: #111827; font-size: 16px; font-weight: 700; }
      .flow { stroke: #6b7280; stroke-width: 1.6; fill: none; }
      @media (prefers-color-scheme: dark) {
        .box { fill: #1f2430; stroke: #4b5563; }
        .edge { fill: #262b38; stroke: #4b5563; }
        .svc { fill: #3a2e1c; stroke: #d98a2b; }
        .cloud { fill: #23283a; stroke: #6366f1; }
        .lbl { fill: #e5e7eb; }
        .lbl-sm { fill: #cbd5e1; }
        .title { fill: #f3f4f6; }
        .flow { stroke: #94a3b8; }
      }
    </style>
  </defs>

  <text x="20" y="30" class="title">Additional services on top of the VPN (redrawn from memory)</text>

  <!-- user -->
  <rect x="20" y="154" width="120" height="52" class="box" rx="8"/>
  <text x="80" y="177" class="lbl" text-anchor="middle" font-weight="700">User</text>
  <text x="80" y="194" class="lbl-sm" text-anchor="middle">VPN client</text>

  <!-- OpenVPN + iptables -->
  <rect x="180" y="146" width="130" height="68" class="edge box" rx="8"/>
  <text x="245" y="172" class="lbl" text-anchor="middle" font-weight="700">OpenVPN</text>
  <text x="245" y="192" class="lbl-sm" text-anchor="middle">+ iptables redirect</text>

  <!-- squid -->
  <rect x="350" y="146" width="130" height="68" class="svc box" rx="8"/>
  <text x="415" y="172" class="lbl" text-anchor="middle" font-weight="700">squid</text>
  <text x="415" y="192" class="lbl-sm" text-anchor="middle">proxy router</text>

  <path class="flow" d="M140 180 L180 180" marker-end="url(#arrow)"/>
  <path class="flow" d="M310 180 L350 180" marker-end="url(#arrow)"/>

  <!-- compression: ziproxy low + high -->
  <rect x="560" y="60" width="160" height="60" class="svc box" rx="8"/>
  <text x="640" y="84" class="lbl" text-anchor="middle" font-weight="700">ziproxy</text>
  <text x="640" y="104" class="lbl-sm" text-anchor="middle">low / high compression</text>

  <!-- ad blocking: privoxy -->
  <rect x="560" y="150" width="160" height="60" class="svc box" rx="8"/>
  <text x="640" y="174" class="lbl" text-anchor="middle" font-weight="700">privoxy</text>
  <text x="640" y="194" class="lbl-sm" text-anchor="middle">ad blocking</text>

  <!-- c-icap -->
  <rect x="560" y="240" width="160" height="60" class="svc box" rx="8"/>
  <text x="640" y="264" class="lbl" text-anchor="middle" font-weight="700">c-icap</text>
  <text x="640" y="284" class="lbl-sm" text-anchor="middle">ICAP adaptation</text>

  <!-- clamav + url filtration under c-icap -->
  <rect x="540" y="330" width="90" height="52" class="box" rx="8"/>
  <text x="585" y="354" class="lbl" text-anchor="middle">clamav</text>
  <text x="585" y="371" class="lbl-sm" text-anchor="middle">antivirus</text>

  <rect x="650" y="330" width="110" height="52" class="box" rx="8"/>
  <text x="705" y="354" class="lbl" text-anchor="middle">url filter</text>
  <text x="705" y="371" class="lbl-sm" text-anchor="middle">parental control</text>

  <!-- squid fan-out: trunk leaves squid at y=180 (straight through to privoxy and Internet), bus at x=520 feeds ziproxy and c-icap -->
  <path class="flow" d="M480 180 L560 180" marker-end="url(#arrow)"/>
  <path class="flow" d="M520 90 L520 270" fill="none"/>
  <path class="flow" d="M520 90 L560 90" marker-end="url(#arrow)"/>
  <path class="flow" d="M520 270 L560 270" marker-end="url(#arrow)"/>

  <!-- c-icap down to scanners: straight vertical drops -->
  <path class="flow" d="M585 300 L585 330" marker-end="url(#arrow)"/>
  <path class="flow" d="M705 300 L705 330" marker-end="url(#arrow)"/>

  <!-- internet -->
  <ellipse cx="820" cy="180" rx="60" ry="34" class="cloud box"/>
  <text x="820" y="185" class="lbl" text-anchor="middle" font-weight="700">Internet</text>
  <!-- services converge onto a vertical bus at x=740, then a single trunk into the cloud -->
  <path class="flow" d="M720 90 L740 90" fill="none"/>
  <path class="flow" d="M720 270 L740 270" fill="none"/>
  <path class="flow" d="M740 90 L740 270" fill="none"/>
  <path class="flow" d="M720 180 L760 180" marker-end="url(#arrow)"/>

  <!-- legend -->
  <rect x="20" y="410" width="14" height="14" class="edge box" rx="3"/>
  <text x="40" y="421" class="lbl-sm">VPN edge</text>
  <rect x="120" y="410" width="14" height="14" class="svc box" rx="3"/>
  <text x="140" y="421" class="lbl-sm">open-sourced Chef cookbooks: c-icap, ziproxy, privoxy</text>
</svg>
